version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "No build step for vanilla JS"
    build:
      commands:
        - echo "Copying static files"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: no-referrer-when-downgrade
  - pattern: '/assets/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '/images/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
